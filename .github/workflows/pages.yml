
name: Deploy Next Level Learning Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract Website
        run: |
          mkdir site
          unzip -q Next_Level_Learning_Academy_GitHub_Pages_SEO_Ready.zip -d site
      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
