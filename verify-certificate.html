<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Verification | Next Level Learning Academy</title><link rel="stylesheet" href="css/portal.css"><style>body{background:linear-gradient(135deg,#eff6ff,#f8fbff);min-height:100vh}.verify-wrap{width:min(92%,680px);margin:70px auto 30px}.verify-card{background:#fff;border:1px solid #dce8f7;border-radius:22px;padding:clamp(20px,5vw,36px);box-shadow:0 18px 45px #153d7015}.verify-status{padding:14px;border-radius:12px;background:#f2f6fc;margin-top:16px}.valid{background:#e9f9ef;color:#176b3b}.invalid{background:#fff0f0;color:#a12828}.verify-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.verify-meta div{padding:12px;background:#f6f9fd;border-radius:10px;overflow-wrap:anywhere}.verify-meta small{display:block;color:#64748b;margin-bottom:5px}@media(max-width:520px){.verify-meta{grid-template-columns:1fr}}</style></head><body><main class="verify-wrap"><section class="verify-card"><p class="muted">NEXT LEVEL LEARNING ACADEMY</p><h1>Certificate Verification</h1><p>यह पेज Academy Certificate की स्थिति जाँचता है।</p><div id="verifyResult" class="verify-status">Certificate जाँचा जा रहा है...</div><div id="verifyDetails" class="verify-meta"></div><p style="margin-top:22px"><a href="index.html">← Home</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script>(async()=>{const r=document.getElementById('verifyResult'),d=document.getElementById('verifyDetails'),id=new URLSearchParams(location.search).get('id');if(!id){r.className='verify-status invalid';r.textContent='Certificate ID नहीं दिया गया।';return;}if(!window.nllaSupabase){r.className='verify-status invalid';r.textContent='Verification service उपलब्ध नहीं है।';return;}const {data,error}=await window.nllaSupabase.rpc('verify_course_certificate',{p_certificate_number:id});if(error){r.className='verify-status invalid';r.textContent='Verification error: '+error.message;return;}const x=Array.isArray(data)?data[0]:null;if(!x){r.className='verify-status invalid';r.textContent='Certificate नहीं मिला।';return;}const ok=x.certificate_status==='issued';r.className='verify-status '+(ok?'valid':'invalid');r.textContent=ok?'✓ VALID CERTIFICATE':'✕ REVOKED CERTIFICATE';const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));d.innerHTML=[['Certificate ID',x.certificate_number],['Student',x.student_name],['Course',x.course_title],['Issued On',x.issued_at?new Date(x.issued_at).toLocaleDateString('en-IN'):'—']].map(([k,v])=>'<div><small>'+k+'</small><b>'+safe(v)+'</b></div>').join('');})();</script><script src="js/navigation.js"></script></body></html>
